<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warrant — console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312151a'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23b08d4f' stroke-width='1.6'/%3E%3Ctext x='16' y='21' font-family='Courier New,monospace' font-size='13' font-weight='700' fill='%23b08d4f' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
  :root {
    /* Same desk/ink/stamp palette as the overview page (ui/index.html). */
    --bg: #12151a;
    --surface: #171b21;
    --surface-2: #1b2028;
    --line: #262d36;
    --text: #ece5d6;
    --muted: #9c8f78;
    --muted-2: #6f6553;
    --green: #5fae82;
    --green-soft: rgba(95, 174, 130, 0.13);
    --red: #cf6b70;
    --red-soft: rgba(207, 107, 112, 0.13);
    --amber: #b08d4f;
    --amber-soft: rgba(176, 141, 79, 0.13);
    --blue: #6f93ac;
    --blue-soft: rgba(111, 147, 172, 0.12);
    --mono: "Cascadia Mono", "Consolas", "SFMono-Regular", ui-monospace, monospace;
    --sans: "Segoe UI", system-ui, sans-serif;
    --display: "Courier New", "Courier Prime", ui-monospace, monospace;
    --maxw: 56rem;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
  }
  a { color: inherit; }
  code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 0.05em 0.35em;
    border-radius: 3px;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 1.5rem; }

  /* ---------------- header ---------------- */
  #top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 1rem;
    padding: 0.9rem 1.5rem;
    border-bottom: 1px solid var(--line);
    background: rgba(18, 21, 26, 0.9);
    backdrop-filter: blur(8px);
  }
  #top .wrap { display: flex; align-items: center; gap: 1rem; width: 100%; padding: 0; }
  #brand {
    display: inline-flex; align-items: center; gap: 0.55rem;
    font-family: var(--display); font-size: 1.02rem; font-weight: 700; letter-spacing: 0.02em;
    color: var(--text); text-decoration: none;
  }
  #brand:hover { color: var(--amber); }
  #brand:hover .brandmark { border-color: var(--amber); color: var(--amber); }
  .brandmark {
    width: 1.5rem; height: 1.5rem; border-radius: 50%;
    border: 1.5px solid var(--muted); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 700; font-size: 0.78rem;
    flex: 0 0 auto; transition: border-color 0.15s, color 0.15s;
  }
  #top-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
  #project-chip {
    font-size: 0.82rem; color: var(--muted);
    border: 1px solid var(--line); background: var(--surface-2);
    padding: 0.22rem 0.6rem; border-radius: 999px;
  }
  #project-chip strong { color: var(--text); font-weight: 600; }
  #conn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.74rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted);
  }
  #conndot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--amber); }
  #conn.live { color: var(--green); }
  #conn.live #conndot { background: var(--green); }
  #conn.down { color: var(--red); }
  #conn.down #conndot { background: var(--red); }
  #conn.wait #conndot { background: var(--amber); }

  /* ---------------- status banner (one line, only when something's missing) ---------------- */
  #status {
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  #status .wrap { padding: 0.6rem 1.5rem; font-size: 0.86rem; color: var(--muted); }
  #status code { font-size: 0.78rem; }

  /* ---------------- layout ---------------- */
  #main { padding: 2.5rem 0 4rem; }
  .block { margin-bottom: 3rem; }
  .block-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .block-head h2 {
    margin: 0; font-family: var(--display); font-size: 1.05rem; font-weight: 700; letter-spacing: 0.01em;
  }
  .block-meta { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }

  /* ---- warrant roster ---- */
  .wrow {
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    margin-bottom: 0.55rem; cursor: pointer; overflow: hidden;
    transition: border-color 0.12s;
  }
  .wrow:hover { border-color: var(--muted-2); }
  .wrow.selected { border-color: var(--amber); }
  .wrow.inactive { opacity: 0.62; }
  .wrow.inactive.selected { opacity: 0.85; }
  .wrow-top {
    display: flex; align-items: baseline; gap: 0.85rem; flex-wrap: wrap;
    padding: 0.65rem 0.85rem;
  }
  .wagent { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
  .wtask { flex: 1 1 auto; min-width: 8rem; font-size: 0.86rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wttl { font-family: var(--mono); font-size: 0.8rem; color: var(--green); white-space: nowrap; }
  .wttl.warn { color: var(--amber); }
  .wttl.crit, .wttl.dead { color: var(--red); }
  .wbadge {
    font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.1rem 0.4rem; border-radius: 3px; border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap;
  }
  .wbadge.live { color: var(--green); border-color: rgba(95,174,130,0.4); background: var(--green-soft); }
  .wbadge.closed { color: var(--red); border-color: rgba(207,107,112,0.4); background: var(--red-soft); }
  .wbadge.expired { color: var(--muted); }
  .wrow-detail { padding: 0 0.85rem 0.85rem; border-top: 1px solid var(--line); padding-top: 0.75rem; }

  /* ---- grant / op cards (used both in roster detail and the raw-surface compare) ---- */
  .op, .grant {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.65rem 0.8rem;
    margin-bottom: 0.6rem;
    background: var(--surface);
  }
  .wrow-detail .op, .wrow-detail .grant { background: var(--surface-2); }
  .op.full { opacity: 0.75; border-style: dashed; }
  .op.mut .op-name { color: var(--red); }
  .op-name { font-family: var(--mono); font-weight: 700; font-size: 0.92rem; word-break: break-word; }
  .op-tag {
    display: inline-block; margin-left: 0.4rem;
    font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid currentColor; padding: 0 0.3rem; border-radius: 3px; vertical-align: 0.1em;
  }
  .op-meta { margin-top: 0.3rem; font-size: 0.8rem; color: var(--muted); font-family: var(--mono); }
  .op-desc { margin-top: 0.3rem; font-size: 0.84rem; color: var(--muted); }

  .grant { border-left: 3px solid var(--green); background: var(--green-soft); border-color: rgba(95,174,130,0.35); }
  .grant.wild { border-left-color: var(--amber); background: var(--amber-soft); border-color: rgba(176,141,79,0.4); }
  .grant.exhausted { opacity: 0.68; }
  .grant .op-name { color: var(--green); }
  .grant.wild .op-name { color: var(--amber); }
  .grant-row { display: grid; grid-template-columns: 5.5rem minmax(0,1fr); gap: 0.35rem; margin-top: 0.28rem; font-size: 0.83rem; }
  .grant-k { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; padding-top: 0.1rem; }
  .grant-v { font-family: var(--mono); word-break: break-word; }
  .grant-why { margin-top: 0.45rem; padding-top: 0.4rem; border-top: 1px solid rgba(255,255,255,0.07); font-size: 0.82rem; color: var(--muted); font-style: italic; }

  .lineage {
    border: 1px solid var(--blue-soft); background: var(--blue-soft); border-radius: 6px;
    padding: 0.5rem 0.7rem; margin-bottom: 0.6rem; font-size: 0.8rem;
  }
  .lineage .ltag {
    display: inline-block; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--blue); color: #04101a; padding: 0.05rem 0.35rem; border-radius: 3px; margin-right: 0.35rem;
  }
  .lineage .ltag.del { background: var(--amber); color: #1a1206; }
  .lineage .ltag.closed { background: var(--red); color: #1a0708; }
  .lineage .bits { color: var(--muted); margin-top: 0.25rem; font-family: var(--mono); font-size: 0.76rem; }

  .empty {
    border: 1px dashed var(--line); border-radius: 6px; padding: 1rem 1.1rem; color: var(--muted);
  }
  .empty .etitle { color: var(--text); font-weight: 700; margin-bottom: 0.3rem; }
  .empty .enote { font-size: 0.87rem; line-height: 1.45; }

  /* ---- compare disclosure ---- */
  details.compare { margin-top: 1.2rem; }
  details.compare summary {
    cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
    padding: 0.5rem 0; user-select: none;
  }
  details.compare summary::-webkit-details-marker { display: none; }
  details.compare summary::before { content: "▸ "; color: var(--amber); }
  details.compare[open] summary::before { content: "▾ "; }
  details.compare summary:hover { color: var(--text); }
  .compare-body { padding-top: 0.7rem; }
  .panel-tools { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
  .panel-tools select {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.22rem 0.4rem; font-family: var(--mono); font-size: 0.8rem;
  }
  .muted-note { font-family: var(--mono); font-size: 0.78rem; color: var(--muted-2); }

  /* ---- decisions ---- */
  .legend-line { font-size: 0.8rem; color: var(--muted-2); margin-bottom: 1rem; }
  .legend-line b.allow { color: var(--green); font-weight: 700; }
  .legend-line b.deny { color: var(--red); font-weight: 700; }
  .legend-line b.ctrl { color: var(--blue); font-weight: 700; }

  #filter-note {
    display: none; cursor: pointer;
    font-size: 0.82rem; color: var(--amber);
    border: 1px solid rgba(176,141,79,0.4); background: var(--amber-soft);
    border-radius: 6px; padding: 0.45rem 0.7rem; margin-bottom: 0.9rem;
  }
  #filter-note:hover { border-color: var(--amber); }
  #filter-note .x { float: right; font-family: var(--mono); }

  #tally .ta { color: var(--green); }
  #tally .td { color: var(--red); }
  #tally .tc { color: var(--blue); }
  #tally .sep { color: var(--line); margin: 0 0.3rem; }

  .scroll-panel {
    max-height: 30rem; overflow: auto;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    padding: 0.2rem 0.2rem;
  }
  .scroll-panel::-webkit-scrollbar { width: 8px; }
  .scroll-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .entry {
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    padding: 0.65rem 0.85rem;
  }
  .entry:last-child { border-bottom: none; }
  .entry.allow { border-left-color: var(--green); background: var(--green-soft); }
  .entry.deny { border-left-color: var(--red); background: var(--red-soft); }
  .entry.ctrl { border-left-color: var(--blue); background: var(--blue-soft); }
  .entry.ctrl.deny { border-left-color: var(--red); background: var(--red-soft); }
  .entry-top { display: flex; gap: 0.55rem; align-items: baseline; flex-wrap: wrap; }
  .entry-dec { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.1rem 0.4rem; border-radius: 3px; }
  .entry.allow .entry-dec { background: var(--green); color: #06140c; }
  .entry.deny .entry-dec { background: var(--red); color: #1a0708; }
  .entry.ctrl .entry-dec { background: var(--blue); color: #04101a; }
  .entry.ctrl.deny .entry-dec { background: var(--red); color: #1a0708; }
  .entry-op { font-family: var(--mono); font-weight: 700; word-break: break-word; }
  .entry-agent { font-family: var(--mono); font-size: 0.76rem; color: var(--muted-2); }
  .entry-time { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 0.76rem; }
  .entry-res { margin-top: 0.25rem; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
  .entry-reason { margin-top: 0.35rem; font-size: 0.86rem; line-height: 1.35; }
  .entry-args { margin-top: 0.25rem; font-family: var(--mono); font-size: 0.74rem; color: var(--muted-2); word-break: break-word; }
  .entry.flash { animation: flash 0.7s ease-out 1; }
  @keyframes flash { 0% { filter: brightness(1.3); } 100% { filter: none; } }
  @media (prefers-reduced-motion: reduce) { .entry.flash { animation: none; } }

  @media (max-width: 620px) {
    #top { padding: 0.75rem 1rem; }
    #main { padding: 1.75rem 0 3rem; }
    .grant-row, .op-meta { font-size: 0.8rem; }
    .wtask { min-width: 100%; order: 3; white-space: normal; }
  }
</style>
</head>
<body>

<header id="top">
  <div class="wrap">
    <a id="brand" href="/" title="Back to overview"><span class="brandmark">W</span>Warrant</a>
    <div id="top-right">
      <div id="project-chip"><strong id="project-name">…</strong> <span id="project-meta"></span></div>
      <div id="conn" class="wait"><span id="conndot"></span><span id="conntext">connecting</span></div>
    </div>
  </div>
</header>

<div id="status" style="display:none"><div class="wrap" id="status-text"></div></div>

<main id="main">
  <div class="wrap">

    <section class="block" id="warrant-block">
      <div class="block-head">
        <h2>Warrants</h2>
        <div class="block-meta" id="roster-count">no warrants yet</div>
      </div>
      <div id="roster"></div>

      <details class="compare">
        <summary>Compare with a raw API key surface</summary>
        <div class="compare-body">
          <div class="panel-tools">
            <label id="ns-filter-wrap" style="display:none;">
              Filter <select id="ns-filter"></select>
            </label>
            <span class="muted-note" id="surface-count">loading…</span>
          </div>
          <div id="wall"></div>
        </div>
      </details>
    </section>

    <section class="block" id="decisions-block">
      <div class="block-head">
        <h2>Live decisions</h2>
        <div class="block-meta" id="tally"><span class="ta" id="n-allow">0 allowed</span><span class="sep">·</span><span class="td" id="n-deny">0 denied</span><span class="sep">·</span><span class="tc" id="n-ctrl">0 setup</span></div>
      </div>
      <div id="filter-note"></div>
      <div class="legend-line"><b class="allow">ALLOW</b> forwarded with the real key · <b class="deny">DENY</b> nothing reached your API · <b class="ctrl">SETUP</b> mint / register / close</div>
      <div id="auditlist" class="scroll-panel"></div>
    </section>

  </div>
</main>

<script>
(function () {
  "use strict";

  var API = (location.protocol === "file:" || !location.host) ? "http://127.0.0.1:8100" : "";
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function getJSON(path) {
    return fetch(API + path, { cache: "no-store" }).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }

  var catalogState = {
    surface: [], argsByOp: {}, opsById: {}, namespaces: [],
    project: null, builtins: true, filterNs: "all", operationCount: 0
  };

  var sawCall = false;

  /* One line, only shown when the reader needs to do something next. Disappears
     entirely once the catalog, a warrant, and a call all exist. */
  function updateStatus() {
    var box = $("status");
    var text = $("status-text");
    var hasCatalog = catalogState.operationCount > 0;
    var hasWarrant = roster.length > 0;

    if (!hasCatalog) {
      box.style.display = "";
      text.innerHTML = "No operations registered yet. From <code>warrant/</code>: <code>python -m demo.stack up --profile wrap</code>, then <code>python -m mcp_server.sync --config examples/wrap_mock.json</code>.";
    } else if (!hasWarrant) {
      box.style.display = "";
      text.innerHTML = catalogState.operationCount + " operation" + (catalogState.operationCount === 1 ? "" : "s") + " registered. Mint a warrant: <code>python -m demo.operator --task \"…\" --quiet</code>.";
    } else if (!sawCall) {
      box.style.display = "";
      text.innerHTML = "Warrant active. Point Cursor at <code>run_mcp.py</code> with <code>WARRANT_TOKEN</code> set — calls will appear below.";
    } else {
      box.style.display = "none";
    }
  }

  function applyProjectChrome(data) {
    var projects = (data && data.projects) || [];
    var project = (data && data.project) || (projects.length ? projects[projects.length - 1] : null);
    var namespaces = (data && data.namespaces) || [];
    catalogState.project = project;
    catalogState.namespaces = namespaces;
    catalogState.builtins = !!(data && data.builtins);
    catalogState.operationCount = (data && data.operation_count) || ((data && data.operations) || []).length;

    if (project && project.name) {
      $("project-name").textContent = project.name;
      var bits = [];
      if (project.namespace) bits.push(project.namespace);
      if (project.owner) bits.push(String(project.owner));
      bits.push(catalogState.operationCount + " ops");
      $("project-meta").textContent = "· " + bits.join(" · ");
    } else {
      $("project-name").textContent = catalogState.builtins ? "Built-in catalog" : "Catalog";
      $("project-meta").textContent = catalogState.operationCount ? "· " + catalogState.operationCount + " ops" : "";
    }

    var wrap = $("ns-filter-wrap");
    var sel = $("ns-filter");
    if (namespaces.length > 0 || catalogState.builtins) {
      wrap.style.display = "inline-flex";
      wrap.style.alignItems = "center";
      wrap.style.gap = "0.35rem";
      sel.innerHTML = '<option value="all">all ops</option>';
      if (catalogState.builtins) sel.innerHTML += '<option value="__builtin__">builtin</option>';
      for (var i = 0; i < namespaces.length; i++) {
        sel.innerHTML += '<option value="' + esc(namespaces[i]) + '">' + esc(namespaces[i]) + "</option>";
      }
      if (!catalogState.builtins && namespaces.length === 1 && catalogState.filterNs === "all") {
        catalogState.filterNs = namespaces[0];
      }
      sel.value = catalogState.filterNs;
      if (![].some.call(sel.options, function (o) { return o.value === sel.value; })) {
        sel.value = "all";
        catalogState.filterNs = "all";
      }
    } else {
      wrap.style.display = "none";
      catalogState.filterNs = "all";
    }
    updateStatus();
  }

  function opMatchesFilter(opName) {
    var ns = catalogState.filterNs;
    if (!ns || ns === "all") return true;
    if (ns === "__builtin__") return String(opName).indexOf(".") === -1;
    return opName === ns || String(opName).indexOf(ns + ".") === 0;
  }

  function renderWall(surface, argsByOp) {
    var html = "";
    var shown = 0, mutating = 0;
    for (var i = 0; i < surface.length; i++) {
      var row = surface[i] || {};
      if (!opMatchesFilter(row.op || "")) continue;
      shown++;
      var isMut = !!row.mutating;
      if (isMut) mutating++;
      var detail = catalogState.opsById[row.op] || {};
      var argNames = argsByOp[row.op] || [];
      html +=
        '<div class="op full' + (isMut ? " mut" : "") + '">' +
          '<div class="op-name">' + esc(row.op) +
            (isMut ? '<span class="op-tag">writes</span>' : '<span class="op-tag">read</span>') +
          "</div>" +
          '<div class="op-meta">any resource · no limits · unlimited uses' +
            (argNames.length ? " · args: " + esc(argNames.join(", ")) : "") +
          "</div>" +
          (detail.description ? '<div class="op-desc">' + esc(detail.description) + "</div>" : "") +
        "</div>";
    }
    if (!shown) {
      html = '<div class="empty"><div class="etitle">No operations yet</div>' +
        '<div class="enote">Register a manifest or sync an MCP so this list fills in.</div></div>';
    }
    $("wall").innerHTML = html;
    $("surface-count").textContent = shown + " ops · " + mutating + " can change state · unbounded";
  }

  function loadCatalog() {
    getJSON("/catalog").then(function (data) {
      var ops = (data && data.operations) || [];
      var argsByOp = {};
      var opsById = {};
      for (var k = 0; k < ops.length; k++) {
        argsByOp[ops[k].op] = ops[k].args ? Object.keys(ops[k].args) : [];
        opsById[ops[k].op] = ops[k];
      }
      var surface = (data && data.full_surface) || [];
      if (!surface.length) {
        surface = ops.map(function (o) {
          return { op: o.op, resource: "* (any)", constraints: "none", uses: "unlimited", mutating: !!o.mutating };
        });
      }
      catalogState.surface = surface;
      catalogState.argsByOp = argsByOp;
      catalogState.opsById = opsById;
      applyProjectChrome(data);
      renderWall(surface, argsByOp);
    }).catch(function () {
      $("surface-count").textContent = "broker unreachable — retrying…";
      $("wall").innerHTML =
        '<div class="empty"><div class="etitle">Waiting for the broker</div>' +
        '<div class="enote">Start the stack from the <code>warrant/</code> folder, then refresh.</div></div>';
      setTimeout(loadCatalog, 2000);
    });
  }

  function shortId(id) {
    if (!id || id === "-" || id === "?") return "—";
    var s = String(id);
    return s.length > 10 ? s.slice(0, 8) : s;
  }

  function fmtConstraints(c) {
    if (!c) return null;
    var keys = Object.keys(c);
    if (!keys.length) return null;
    var parts = [];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], v = c[k] || {}, bits = [];
      if (v.lte !== null && v.lte !== undefined) bits.push("≤ " + v.lte);
      if (v.gte !== null && v.gte !== undefined) bits.push("≥ " + v.gte);
      if (v.eq !== null && v.eq !== undefined) bits.push("= " + v.eq);
      if (v.one_of !== null && v.one_of !== undefined) bits.push("one of [" + v.one_of.join(", ") + "]");
      parts.push(k + " " + (bits.length ? bits.join(" and ") : "(unbounded)"));
    }
    return parts.join(" · ");
  }

  function lineageHtml(w, closed) {
    if (!w) return "";
    var depth = typeof w.depth === "number" ? w.depth : 0;
    var isDel = !!(w.parent_id) || depth > 0;
    var html = '<div class="lineage">';
    html += '<span class="ltag' + (isDel ? " del" : "") + '">' + (isDel ? "delegated · depth " + depth : "root") + "</span>";
    if (closed) html += '<span class="ltag closed">closed</span>';
    html += '<div class="bits">principal ' + esc(w.principal || "—") +
      " · warrant " + esc(shortId(w.warrant_id)) +
      (isDel ? " · from " + esc(shortId(w.parent_id)) : "") +
      "</div></div>";
    return html;
  }

  function grantsHtml(w, used, closed) {
    used = used || [];
    var grants = w.grants || [];
    var html = lineageHtml(w, closed);
    var wild = 0, exhausted = 0;
    for (var i = 0; i < grants.length; i++) {
      var g = grants[i] || {};
      var res = g.resource == null ? "*" : String(g.resource);
      var isWild = /:\*$/.test(res) || res === "*";
      if (isWild) wild++;
      var cons = fmtConstraints(g.constraints);
      var uses = g.uses == null ? 1 : g.uses;
      var spent = typeof used[i] === "number" ? used[i] : 0;
      var left = Math.max(0, uses - spent);
      if (left === 0) exhausted++;
      html +=
        '<div class="grant' + (isWild ? " wild" : "") + (left === 0 ? " exhausted" : "") + '">' +
          '<div class="op-name">' + esc(g.op) + (isWild ? '<span class="op-tag">wide</span>' : "") + "</div>" +
          '<div class="grant-row"><div class="grant-k">On</div><div class="grant-v">' + esc(res) + "</div></div>" +
          '<div class="grant-row"><div class="grant-k">Limits</div><div class="grant-v">' + esc(cons || "none") + "</div></div>" +
          '<div class="grant-row"><div class="grant-k">Uses left</div><div class="grant-v">' +
            esc(left) + " of " + esc(uses) + "</div></div>" +
          (g.justification ? '<div class="grant-why">' + esc(g.justification) + "</div>" : "") +
        "</div>";
    }
    if (!grants.length) {
      html += '<div class="empty" style="border:none; padding:0;"><div class="etitle">Zero grants</div><div class="enote">Every call from this warrant will be denied.</div></div>';
    }
    return html;
  }

  /* ------------------------------------------------------------ warrant roster
     Every warrant this broker knows about (root or delegated), not just the one
     slot /mint last pointed at -- so this scales to any number of concurrently
     connected agents instead of only ever showing "the" warrant. */

  var roster = [];
  var rosterById = {};
  var rosterLoadedOnce = false;
  var selectedId = null;
  var detailCache = {};
  var detailLoading = {};
  var rosterEndpointMissing = false;

  function warrantEmptyState() {
    return '<div class="empty">' +
      '<div class="etitle">No warrant yet</div>' +
      '<div class="enote">Mint one for a concrete task. The grants that appear here are the only things an agent or MCP client will be allowed to do.</div>' +
      "</div>";
  }

  function statusOf(w) {
    if (w.closed) return "closed";
    if (w.expired) return "expired";
    return "live";
  }

  function ensureDetail(id) {
    if (detailCache[id] || detailLoading[id]) return;
    detailLoading[id] = true;
    getJSON("/warrant/" + encodeURIComponent(id)).then(function (data) {
      detailCache[id] = data;
      delete detailLoading[id];
      if (selectedId === id) renderRoster();
    }).catch(function () {
      delete detailLoading[id];
    });
  }

  function renderRoster() {
    var box = $("roster");
    if (!roster.length) {
      box.innerHTML = warrantEmptyState();
      $("roster-count").textContent = "no warrants yet";
      return;
    }
    var live = 0;
    for (var i = 0; i < roster.length; i++) if (roster[i].live) live++;
    $("roster-count").textContent =
      roster.length + (roster.length === 1 ? " warrant" : " warrants") +
      (live ? " · " + live + " live" : "");

    var html = "";
    for (var j = 0; j < roster.length; j++) {
      var w = roster[j];
      var sel = w.warrant_id === selectedId;
      var status = statusOf(w);
      html += '<div class="wrow' + (sel ? " selected" : "") + (status !== "live" ? " inactive" : "") +
        '" data-id="' + esc(w.warrant_id) + '">';
      html += '<div class="wrow-top">';
      html += '<span class="wagent">' + esc(w.agent || "—") +
        (w.depth > 0 ? '<span class="op-tag" style="margin-left:0.4rem;">delegated</span>' : "") + "</span>";
      html += '<span class="wtask">' + esc(w.task_statement || "(no task statement)") + "</span>";
      html += status === "live"
        ? '<span class="wttl" data-expires="' + w.expires_at + '">--:--</span>'
        : '<span class="wttl dead">' + esc(status) + "</span>";
      html += '<span class="wbadge ' + status + '">' + status +
        (w.grant_count === 1 ? " · 1 grant" : " · " + w.grant_count + " grants") + "</span>";
      html += "</div>";
      if (sel) {
        html += '<div class="wrow-detail">' + renderDetailBody(w.warrant_id) + "</div>";
      }
      html += "</div>";
    }
    box.innerHTML = html;
    tickTTL();
  }

  function renderDetailBody(id) {
    ensureDetail(id);
    var detail = detailCache[id];
    if (!detail) {
      return '<div class="empty" style="border:none; padding:0;"><div class="enote">Loading grants…</div></div>';
    }
    return grantsHtml(detail.warrant, detail.used, detail.closed);
  }

  function loadRoster() {
    if (rosterEndpointMissing) return;
    getJSON("/warrants").then(function (data) {
      roster = (data && data.warrants) || [];
      rosterById = {};
      for (var i = 0; i < roster.length; i++) rosterById[roster[i].warrant_id] = roster[i];

      // Helpful default for the common case (one agent, one warrant): expand it
      // automatically, exactly once, so a single-agent session looks the same
      // as it always did. Never re-forces a selection the reader made or cleared.
      if (!rosterLoadedOnce) {
        rosterLoadedOnce = true;
        var live = roster.filter(function (w) { return w.live; });
        if (live.length === 1) selectedId = live[0].warrant_id;
      }
      renderRoster();
      updateStatus();
    }).catch(function (err) {
      if (err && err.status === 404) rosterEndpointMissing = true;
    });
  }

  $("roster").addEventListener("click", function (ev) {
    var row = ev.target.closest ? ev.target.closest(".wrow") : null;
    if (!row) return;
    var id = row.getAttribute("data-id");
    selectedId = selectedId === id ? null : id;
    renderRoster();
    renderAuditList();
    updateFilterNote();
  });

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function tickTTL() {
    var els = document.querySelectorAll(".wttl[data-expires]");
    var now = Date.now() / 1000;
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var remain = parseFloat(el.getAttribute("data-expires")) - now;
      el.classList.remove("warn", "crit", "dead");
      if (remain <= 0) { el.textContent = "expired"; el.classList.add("dead"); continue; }
      var m = Math.floor(remain / 60), s = Math.floor(remain % 60);
      el.textContent = pad2(m) + ":" + pad2(s);
      if (remain < 15) el.classList.add("crit");
      else if (remain < 60) el.classList.add("warn");
    }
  }

  /* ------------------------------------------------------------ live decisions
     One SSE connection receives every call against the broker, from any warrant.
     Selecting a roster row filters this view client-side by warrant_id -- the
     feed itself stays universal, which is what lets it show a whole fleet. */

  var allEntries = []; // newest first
  var seenIds = Object.create(null);
  var MAX_ENTRIES = 300;
  var listEl = $("auditlist");

  function isControlPlane(op) {
    return !!op && (op === "catalog.register" || op.indexOf("warrant.") === 0);
  }
  function controlVerb(op) {
    var parts = String(op || "").split(".");
    return (parts[parts.length - 1] || op || "?").toUpperCase();
  }
  function controlSubject(e) {
    var args = e.args || {};
    var op = e.op || "";
    if (op === "warrant.delegate") return shortId(args.parent_id || e.resource) + " → " + (args.agent || e.agent || "—");
    if (op === "catalog.register") return args.namespace ? String(args.namespace) : "catalog";
    if (op === "warrant.close" || op === "warrant.revoke") {
      var target = e.resource;
      if (!target || target === "-" || target === e.task_id) target = e.warrant_id;
      return shortId(target);
    }
    if (op === "warrant.mint" || op === "warrant.release") {
      if (e.agent && e.agent !== "unknown") return String(e.agent);
      if (e.warrant_id && e.warrant_id !== "-") return shortId(e.warrant_id);
      return "—";
    }
    if (e.resource && e.resource !== "-" && e.resource !== e.task_id) return shortId(e.resource);
    return "—";
  }

  function emptyAudit() {
    listEl.innerHTML =
      '<div class="empty" style="border:none;">' +
        '<div class="etitle">No calls yet</div>' +
        '<div class="enote">When an MCP client or agent tries a tool, the decision appears here with a plain-language reason.</div>' +
      "</div>";
  }

  function fmtTime(ts) {
    var d = new Date((ts || 0) * 1000);
    if (isNaN(d.getTime())) return "--:--:--";
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  function fmtArgs(args) {
    if (!args) return "";
    var keys = Object.keys(args);
    if (!keys.length) return "";
    var parts = [];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (k === "task_statement") continue;
      var v = args[k];
      if (typeof v === "string" && v.length > 60) v = v.slice(0, 57) + "…";
      if (k === "parent_id" || k === "warrant_id") v = shortId(v);
      if (Array.isArray(v)) v = "[" + v.length + "]";
      parts.push(k + "=" + (typeof v === "object" ? JSON.stringify(v) : v));
    }
    return parts.join("  ");
  }

  function buildRow(e, animate) {
    var ctrl = isControlPlane(e.op);
    var deny = e.decision === "DENY";
    var div = document.createElement("div");
    var kind = ctrl ? ("ctrl" + (deny ? " deny" : "")) : (deny ? "deny" : "allow");
    div.className = "entry " + kind + (animate ? " flash" : "");

    var subject = ctrl ? controlSubject(e) : (e.resource || "—");
    var decision = ctrl ? (deny ? "DENIED" : controlVerb(e.op)) : (deny ? "DENIED" : "ALLOWED");
    var plain =
      ctrl ? "Setup event — not an upstream API call."
           : (deny ? "Blocked. No credential was attached."
                   : "Allowed. Broker attached the real key and forwarded.");
    var argstr = fmtArgs(e.args);

    div.innerHTML =
      '<div class="entry-top">' +
        '<span class="entry-dec">' + esc(decision) + "</span>" +
        '<span class="entry-op">' + esc(e.op) + "</span>" +
        '<span class="entry-agent">' + esc(e.agent || "") + "</span>" +
        '<span class="entry-time">' + esc(fmtTime(e.ts)) + "</span>" +
      "</div>" +
      '<div class="entry-res">target: ' + esc(subject) + "</div>" +
      '<div class="entry-reason"><strong>' + esc(plain) + "</strong> " + esc(e.reason || "") + "</div>" +
      (argstr ? '<div class="entry-args">' + esc(argstr) + "</div>" : "");
    return div;
  }

  function passesFilter(e) {
    return !selectedId || e.warrant_id === selectedId;
  }

  function updateFilterNote() {
    var el = $("filter-note");
    if (!selectedId) { el.style.display = "none"; return; }
    var w = rosterById[selectedId];
    el.style.display = "";
    el.innerHTML = "Showing only <strong>" + esc(w ? w.agent : shortId(selectedId)) +
      "</strong>'s calls.<span class=\"x\">show all ✕</span>";
  }
  $("filter-note").addEventListener("click", function () {
    selectedId = null;
    renderRoster();
    renderAuditList();
    updateFilterNote();
  });

  function recomputeTally() {
    var a = 0, d = 0, c = 0;
    for (var i = 0; i < allEntries.length; i++) {
      if (!passesFilter(allEntries[i])) continue;
      var e = allEntries[i];
      if (isControlPlane(e.op)) c++;
      else if (e.decision === "DENY") d++;
      else a++;
    }
    $("n-allow").textContent = a + " allowed";
    $("n-deny").textContent = d + " denied";
    $("n-ctrl").textContent = c + " setup";
  }

  function renderAuditList() {
    var filtered = allEntries.filter(passesFilter);
    if (!filtered.length) { emptyAudit(); recomputeTally(); return; }
    listEl.innerHTML = "";
    for (var i = 0; i < filtered.length; i++) listEl.appendChild(buildRow(filtered[i], false));
    recomputeTally();
  }

  function idOf(e) {
    return e.entry_id || (String(e.ts) + "|" + e.op + "|" + e.resource + "|" + e.decision + "|" + e.reason);
  }

  function ingest(e) {
    if (!e || typeof e !== "object") return false;
    var id = idOf(e);
    if (seenIds[id]) return false;
    seenIds[id] = true;
    allEntries.unshift(e);
    if (allEntries.length > MAX_ENTRIES) allEntries.pop();
    if (!isControlPlane(e.op) && !sawCall) { sawCall = true; updateStatus(); }
    return true;
  }

  function addEntry(e, animate) {
    if (!ingest(e)) return false;
    if (passesFilter(e)) {
      var placeholder = listEl.querySelector(".empty");
      if (placeholder) listEl.innerHTML = "";
      listEl.insertBefore(buildRow(e, animate), listEl.firstChild);
      while (listEl.children.length > MAX_ENTRIES) listEl.removeChild(listEl.lastChild);
      if (animate) listEl.scrollTop = 0;
    }
    recomputeTally();
    return true;
  }

  function backfill() {
    return getJSON("/audit").then(function (data) {
      var entries = (data && data.entries) || [];
      for (var i = 0; i < entries.length; i++) ingest(entries[i]);
      renderAuditList();
    }).catch(function () {
      if (!allEntries.length) emptyAudit();
    });
  }

  var es = null, retry = 0, retryTimer = null;

  function setConn(state, text) {
    $("conn").className = state;
    $("conntext").textContent = text;
  }

  function connect() {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    if (es) { try { es.close(); } catch (_) {} es = null; }
    setConn("wait", retry ? "reconnecting" : "connecting");
    try { es = new EventSource(API + "/audit/stream"); }
    catch (_) { scheduleReconnect(); return; }

    es.onopen = function () { retry = 0; setConn("live", "live"); backfill(); };
    es.onmessage = function (ev) {
      if (!ev.data) return;
      var e;
      try { e = JSON.parse(ev.data); } catch (_) { return; }
      addEntry(e, true);
      if (e.decision === "ALLOW") loadRoster();
      if ($("conn").className !== "live") setConn("live", "live");
    };
    es.onerror = function () {
      setConn("down", "disconnected");
      if (!es || es.readyState === 2) scheduleReconnect();
    };
  }

  function scheduleReconnect() {
    if (retryTimer) return;
    if (es) { try { es.close(); } catch (_) {} es = null; }
    retry++;
    var delay = Math.min(1000 * Math.pow(1.6, Math.min(retry, 6)), 10000);
    retryTimer = setTimeout(function () { retryTimer = null; connect(); }, delay);
  }

  renderRoster();
  emptyAudit();
  updateStatus();
  $("ns-filter").addEventListener("change", function () {
    catalogState.filterNs = $("ns-filter").value || "all";
    renderWall(catalogState.surface, catalogState.argsByOp);
  });
  loadCatalog();
  loadRoster();
  backfill().then(connect);
  setInterval(loadRoster, 1500);
  setInterval(tickTTL, 250);
  setInterval(loadCatalog, 8000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      loadRoster();
      loadCatalog();
      if (!es || es.readyState === 2) connect(); else backfill();
    }
  });
})();
</script>
</body>
</html>
